name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-build.yml"

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Godot and Android toolchain
        run: |
          godot --version
          java -version
          test -f /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk
          test -x /usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/Frontline-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontline-Android-debug
          path: build/Frontline-debug.apk
          if-no-files-found: error
          retention-days: 14
